name: Refresh profile visuals

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-profile-visuals
  cancel-in-progress: true

jobs:
  render:
    name: Render verified GitHub data
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Check out profile repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Test renderer
        run: npm test

      - name: Render profile visuals
        run: npm run render
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit changed visuals
        run: |
          if git diff --quiet -- README.md assets/; then
            echo "Profile visuals are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/
          git commit -m "chore: refresh profile visuals"
          git push
