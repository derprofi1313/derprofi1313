<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="820" viewBox="0 0 680 820" role="img" aria-labelledby="title desc">
  <title id="title">Jannik Agethen — evidence-first developer tools</title>
  <desc id="desc">A mobile signal-trace graphic introducing Jannik and the path from baseline through change and evidence to review.</desc>
  <defs>
    <linearGradient id="mobileBackground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.58" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#101625"/>
    </linearGradient>
    <linearGradient id="mobileAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5FA2"/>
      <stop offset="0.52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#47D7FF"/>
    </linearGradient>
    <radialGradient id="mobilePinkGlow">
      <stop offset="0" stop-color="#FF5FA2" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mobileGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1C2940" stroke-width="1" stroke-opacity="0.48"/>
    </pattern>
    <filter id="mobileGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="mobileFrame">
      <rect x="1" y="1" width="678" height="818" rx="30"/>
    </clipPath>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pipeline-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 24px; font-weight: 700; letter-spacing: 1.4px; fill: #F4F7FB; }
      .pipeline-note { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; font-weight: 500; fill: #9AA8BC; }
    </style>
  </defs>
  <g clip-path="url(#mobileFrame)">
    <rect width="680" height="820" fill="url(#mobileBackground)"/>
    <rect width="680" height="820" fill="url(#mobileGrid)"/>
    <circle cx="108" cy="56" r="220" fill="url(#mobilePinkGlow)"/>
  </g>
  <rect x="1" y="1" width="678" height="818" rx="30" fill="none" stroke="url(#mobileAccent)" stroke-opacity="0.78" stroke-width="3"/>

  <g transform="translate(32 34)">
    <rect width="526" height="52" rx="26" fill="#101625" stroke="#273651" stroke-width="2"/>
    <circle cx="26" cy="26" r="7" fill="#47D7FF" filter="url(#mobileGlow)"/>
    <text x="49" y="34" class="mono" font-size="18" font-weight="700" letter-spacing="1.2" fill="#DCE4EE">OPEN SOURCE / DEV TOOLS / PRACTICAL AI</text>
  </g>

  <g transform="translate(34 122)">
    <text class="sans" font-size="38" font-weight="750" letter-spacing="1.3" fill="#F4F7FB">HELLO, I&apos;M</text>
    <text y="100" class="sans" font-size="96" font-weight="850" letter-spacing="-3" fill="url(#mobileAccent)">JANNIK.</text>
    <text y="156" class="sans" font-size="27" font-weight="620" fill="#F4F7FB">Evidence-first tools for a noisy web.</text>
    <text y="198" class="mono" font-size="20" font-weight="600" fill="#9AA8BC">change → evidence → review</text>
  </g>

  <g transform="translate(32 370)">
    <rect width="616" height="400" rx="28" fill="#101625" fill-opacity="0.94" stroke="#273651" stroke-width="2"/>
    <text x="30" y="42" class="mono" font-size="19" font-weight="700" letter-spacing="1.6" fill="#47D7FF">SIGNAL TRACE / 001</text>
    <text x="30" y="84" class="sans" font-size="27" font-weight="750" fill="#F4F7FB">Evidence before claims.</text>
    <path d="M74 132V344" stroke="url(#mobileAccent)" stroke-width="5" stroke-linecap="round"/>

    <g transform="translate(74 137)">
      <circle r="13" fill="#080B14" stroke="#FF5FA2" stroke-width="5" filter="url(#mobileGlow)"/>
      <text x="40" y="7" class="pipeline-label">BASELINE</text>
      <text x="40" y="34" class="pipeline-note">capture what exists</text>
    </g>
    <g transform="translate(74 205)">
      <circle r="13" fill="#080B14" stroke="#A78BFA" stroke-width="5"/>
      <text x="40" y="7" class="pipeline-label">CHANGE</text>
      <text x="40" y="34" class="pipeline-note">detect the exact delta</text>
    </g>
    <g transform="translate(74 273)">
      <circle r="13" fill="#080B14" stroke="#C56BE4" stroke-width="5"/>
      <text x="40" y="7" class="pipeline-label">EVIDENCE</text>
      <text x="40" y="34" class="pipeline-note">hash + preserve context</text>
    </g>
    <g transform="translate(74 341)">
      <circle r="13" fill="#080B14" stroke="#47D7FF" stroke-width="5" filter="url(#mobileGlow)"/>
      <text x="40" y="7" class="pipeline-label">REVIEW</text>
      <text x="40" y="34" class="pipeline-note">humans decide the action</text>
    </g>
  </g>
</svg>
