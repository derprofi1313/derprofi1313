<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="380" viewBox="0 0 1160 380" role="img" aria-labelledby="title desc">
  <title id="title">Jannik Agethen — evidence-first developer tools</title>
  <desc id="desc">A dark signal-trace graphic introducing Jannik and the path from baseline through change and evidence to review.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080B14"/>
      <stop offset="0.58" stop-color="#0B1020"/>
      <stop offset="1" stop-color="#101625"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF5FA2"/>
      <stop offset="0.52" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#47D7FF"/>
    </linearGradient>
    <radialGradient id="pinkGlow">
      <stop offset="0" stop-color="#FF5FA2" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#FF5FA2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow">
      <stop offset="0" stop-color="#47D7FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#47D7FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1C2940" stroke-width="1" stroke-opacity="0.48"/>
    </pattern>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="frame">
      <rect x="1" y="1" width="1158" height="378" rx="28"/>
    </clipPath>
    <style>
      .sans { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      .pipeline-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; font-weight: 700; letter-spacing: 1.6px; fill: #F4F7FB; }
      .pipeline-note { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 500; fill: #9AA8BC; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1160" height="380" fill="url(#background)"/>
    <rect width="1160" height="380" fill="url(#grid)"/>
    <circle cx="165" cy="42" r="245" fill="url(#pinkGlow)"/>
    <circle cx="1050" cy="350" r="260" fill="url(#cyanGlow)"/>
    <path d="M0 324 C135 300 180 359 305 325 S508 282 614 315" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.42"/>
    <path d="M0 331 C135 307 180 366 305 332 S508 289 614 322" fill="none" stroke="#47D7FF" stroke-width="1" stroke-opacity="0.18"/>
  </g>
  <rect x="1" y="1" width="1158" height="378" rx="28" fill="none" stroke="url(#accent)" stroke-opacity="0.76" stroke-width="2"/>

  <g transform="translate(54 46)">
    <rect width="392" height="34" rx="17" fill="#101625" stroke="#273651"/>
    <circle cx="18" cy="17" r="5" fill="#47D7FF" filter="url(#softGlow)"/>
    <text x="34" y="22" class="mono" font-size="12" font-weight="700" letter-spacing="1.4" fill="#C8D2E0">OPEN SOURCE / DEV TOOLS / PRACTICAL AI</text>
  </g>

  <g transform="translate(54 118)">
    <text class="sans" font-size="28" font-weight="750" letter-spacing="1.5" fill="#F4F7FB">HELLO, I&apos;M</text>
    <text y="84" class="sans" font-size="86" font-weight="850" letter-spacing="-3" fill="url(#accent)">JANNIK.</text>
    <text y="132" class="sans" font-size="21" font-weight="560" fill="#DCE4EE">I build evidence-first tools for a noisy web.</text>
    <text y="166" class="mono" font-size="14" font-weight="600" letter-spacing="0.8" fill="#9AA8BC">turning change into reviewable signal</text>
  </g>

  <g transform="translate(720 42)">
    <rect width="386" height="296" rx="24" fill="#101625" fill-opacity="0.9" stroke="#273651"/>
    <text x="28" y="38" class="mono" font-size="12" font-weight="700" letter-spacing="1.7" fill="#47D7FF">SIGNAL TRACE / 001</text>
    <text x="28" y="68" class="sans" font-size="18" font-weight="720" fill="#F4F7FB">Evidence before claims.</text>
    <path d="M56 106V248" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

    <g transform="translate(56 111)">
      <circle r="9" fill="#080B14" stroke="#FF5FA2" stroke-width="3" filter="url(#softGlow)"/>
      <text x="27" y="4" class="pipeline-label">BASELINE</text>
      <text x="27" y="21" class="pipeline-note">capture what exists</text>
    </g>
    <g transform="translate(56 157)">
      <circle r="9" fill="#080B14" stroke="#A78BFA" stroke-width="3"/>
      <text x="27" y="4" class="pipeline-label">CHANGE</text>
      <text x="27" y="21" class="pipeline-note">detect the exact delta</text>
    </g>
    <g transform="translate(56 203)">
      <circle r="9" fill="#080B14" stroke="#C56BE4" stroke-width="3"/>
      <text x="27" y="4" class="pipeline-label">EVIDENCE</text>
      <text x="27" y="21" class="pipeline-note">hash + preserve context</text>
    </g>
    <g transform="translate(56 249)">
      <circle r="9" fill="#080B14" stroke="#47D7FF" stroke-width="3" filter="url(#softGlow)"/>
      <text x="27" y="4" class="pipeline-label">REVIEW</text>
      <text x="27" y="21" class="pipeline-note">humans decide the action</text>
    </g>
  </g>
</svg>
